name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Format and strict checks
        run: |
          moon fmt --check
          moon check --target wasm-gc --deny-warn
          moon check --target wasm --deny-warn
          moon check --target js --deny-warn
      - name: Portable tests
        run: |
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target js
      - name: Exercise JavaScript CLI
        shell: bash
        run: |
          moon run cmd/main --target js -- demo | tee demo.txt
          diff -u examples/demo.expected.txt demo.txt
          moon run cmd/main --target js -- scan --text 'mail=a@example.com ip=10.0.0.1' | tee scan.txt
          ! grep -q 'a@example.com' scan.txt
          moon run cmd/main --target js -- profile-check --profile 'default=remove'
          moon run cmd/main --target js -- verify --text 'mail=a@example.com ip=10.0.0.1'
          set +e
          moon run cmd/main --target js -- policy-lint --profile 'default=keep' > unsafe-policy.txt
          status=$?
          set -e
          test "$status" = "1"
          grep -q 'policy.default.keep' unsafe-policy.txt

  native:
    name: Native checks and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Native verification
        run: |
          moon check --target native --deny-warn
          moon test --target native
          moon build cmd/main --target native --release
          moon run cmd/main --target native -- demo | tee demo-native.txt
          diff -u examples/demo.expected.txt demo-native.txt
